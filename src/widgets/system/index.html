<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot System</title>
  <link rel="stylesheet" href="css/widget.css">
</head>
<body>
  <div id="widget" class="widget">
    <canvas id="matrix" aria-label="System monitor"></canvas>
    <div id="rowbtns"></div>
    <div class="controls" id="controls">
      <button id="btn-pin" type="button" title="Keep on top" aria-label="Keep on top">
        <svg viewBox="0 0 16 16"><path d="M9.5 1.5l5 5-2 .5-2.5 2.5.5 3-1.5 1.5-2.5-2.5-3.5 3.5-.5-.5 3.5-3.5L3 8.5 4.5 7l3 .5L10 5l-.5-2z"/></svg>
      </button>
      <button id="btn-settings" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16"><path d="M8 5.2A2.8 2.8 0 1 0 8 10.8 2.8 2.8 0 0 0 8 5.2zm6.3 3.8l-1.4-.3a5 5 0 0 1-.5 1.2l.8 1.2-1.4 1.4-1.2-.8a5 5 0 0 1-1.2.5L9 14.3H7l-.3-1.4a5 5 0 0 1-1.2-.5l-1.2.8-1.4-1.4.8-1.2a5 5 0 0 1-.5-1.2L1.7 9V7l1.4-.3a5 5 0 0 1 .5-1.2l-.8-1.2 1.4-1.4 1.2.8a5 5 0 0 1 1.2-.5L7 1.7h2l.3 1.4a5 5 0 0 1 1.2.5l1.2-.8 1.4 1.4-.8 1.2a5 5 0 0 1 .5 1.2l1.4.3z"/></svg>
      </button>
      <button id="btn-close" type="button" title="Quit" aria-label="Quit">
        <svg viewBox="0 0 16 16"><path d="M4 3l4 4 4-4 1 1-4 4 4 4-1 1-4-4-4 4-1-1 4-4-4-4z"/></svg>
      </button>
    </div>
  </div>
  <script src="../../deck/bridge.js"></script>
  <script src="js/time.js"></script>
  <script src="js/dotmatrix.js"></script>
  <script src="js/system.js"></script>
  <script src="js/chimes.js"></script>
  <script src="js/store.js"></script>
  <script src="js/worldtime.js"></script>
  <script src="js/widget.js"></script>
</body>
</html>
