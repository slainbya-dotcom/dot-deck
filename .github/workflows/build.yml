name: Build Windows installer

# Run manually from the Actions tab (the .msi appears under the run's "Artifacts"),
# or push a tag like v1.0.0 to also put the .msi in a draft GitHub release.
# The Mac .dmg has its own workflow: build-macos.yml.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: dot-deck-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    # Tag builds only.
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
